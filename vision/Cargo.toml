[package]
name = "vision"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
itertools = "0.13.0"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
opencv = "0.93.3"
candle-core = "0.7.2"
candle-nn = "0.7.2"
candle-onnx = "0.7.2"
rayon = "1.10.0"
log = "0.4.22"
ndarray = "0.16.1"
ort = { version =  "=2.0.0-rc.9", features = ["ndarray"] }
candle-transformers = "0.8.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
linfa = { version = "0.7.1", features = ["ndarray-linalg"] }
linfa-datasets = { version = "0.7.1", features = ["generate"] }
linfa-clustering = "0.7.1"